name: Build Standalone iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Sync Web Bundle into iOS Resources
        run: |
          rm -rf ios-app/Resources/static
          mkdir -p ios-app/Resources
          cp -R static ios-app/Resources/static
          ls -la ios-app/Resources/Assets.xcassets/AppIcon.appiconset

      - name: Generate Xcode project & compile unsigned Release IPA
        run: |
          command -v xcodegen || brew install xcodegen
          cd ios-app
          xcodegen generate
          xcodebuild \
            -project YouTubeCaNhan.xcodeproj \
            -scheme YouTubeCaNhan \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES
          rm -rf Payload YouTubeCaNhan.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/YouTubeCaNhan.app Payload/
          python3 -c '
          import os, plistlib
          p = plistlib.loads(open("Payload/YouTubeCaNhan.app/Info.plist", "rb").read())
          for k in ("UILaunchStoryboardName", "UILaunchScreen", "UIBackgroundModes", "UISupportedInterfaceOrientations", "NSAppTransportSecurity"):
              assert k in p, f"Missing {k} in compiled Info.plist!"
          assert "audio" in p["UIBackgroundModes"], "Missing audio background mode!"
          assert os.path.exists("Payload/YouTubeCaNhan.app/LaunchScreen.storyboardc"), "Missing LaunchScreen.storyboardc!"
          print("VERIFIED_INFO_PLIST_OK:", sorted(p.keys()))
          '
          zip -qry YouTubeCaNhan.ipa Payload
          ls -lh YouTubeCaNhan.ipa

      - name: Upload YouTubeCaNhan.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeCaNhan-IPA
          path: ios-app/YouTubeCaNhan.ipa

      - name: Publish Direct IPA to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-ipa
          name: "YouTube Cá Nhân iPhone (Bản độc lập .ipa)"
          body: "Tải trực tiếp file `YouTubeCaNhan.ipa` bên dưới và cài vào iPhone bằng Sideloadly hoặc SideStore."
          files: ios-app/YouTubeCaNhan.ipa
          make_latest: true

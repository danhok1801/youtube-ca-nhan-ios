<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="referrer" content="no-referrer">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="YouTube">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>YouTube</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <!-- Persistent Master Audio Element: NEVER destroyed so iOS Lock Screen keeps background session alive -->
  <audio id="master-audio" preload="auto" playsinline></audio>

  <!-- Top Navigation Bar -->
  <header id="topbar" class="topbar">
    <button id="brand-home" class="brand-btn" aria-label="Trang chủ YouTube">
      <svg class="yt-icon" viewBox="0 0 28 20" width="28" height="20" aria-hidden="true">
        <path fill="#FF0033" d="M27.4 3.1a3.5 3.5 0 0 0-2.47-2.48C22.75 0 14 0 14 0S5.25 0 3.07.62A3.5 3.5 0 0 0 .6 3.1C0 5.28 0 10 0 10s0 4.72.6 6.9a3.5 3.5 0 0 0 2.47 2.48C5.25 20 14 20 14 20s8.75 0 10.93-.62a3.5 3.5 0 0 0 2.47-2.48C28 14.72 28 10 28 10s0-4.72-.6-6.9Z"/>
        <path fill="#FFFFFF" d="M11.2 14.28 18.47 10 11.2 5.72v8.56Z"/>
      </svg>
      <span class="yt-wordmark">YouTube</span>
      <span class="yt-region">VN</span>
    </button>

    <div class="topbar-actions">
      <button id="bg-pill" class="bg-status-pill hidden" title="Chế độ phát nền đang bật">
        <span class="eq-dot"></span>
        <span id="bg-pill-label">Nền</span>
      </button>
      <button id="install-btn" class="install-chip hidden" aria-label="Cài ra màn hình chính">
        Cài iPhone
      </button>
      <button id="open-search-btn" class="icon-btn" aria-label="Tìm kiếm">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
          <path d="M10.5 3a7.5 7.5 0 1 0 4.74 13.32l4.22 4.22a.75.75 0 1 0 1.06-1.06l-4.22-4.22A7.5 7.5 0 0 0 10.5 3Zm-6 7.5a6 6 0 1 1 12 0 6 6 0 0 1-12 0Z"/>
        </svg>
      </button>
      <button id="account-top-btn" class="account-top-btn" aria-label="Tài khoản Google">
        Đăng nhập
      </button>
    </div>
  </header>

  <!-- Category Filter Chips (Home only) -->
  <div id="chips-bar" class="chips-bar">
    <button class="chip active" data-cat="all">Tất cả</button>
    <button class="chip" data-cat="music">Âm nhạc</button>
    <button class="chip" data-cat="remix">Nhạc Remix</button>
    <button class="chip" data-cat="lofi">Lofi Chill</button>
    <button class="chip" data-cat="podcast">Podcast</button>
    <button class="chip" data-cat="gaming">Trò chơi</button>
    <button class="chip" data-cat="news">Tin tức</button>
    <button class="chip" data-cat="comedy">Hài kịch</button>
    <button class="chip" data-cat="tech">Công nghệ</button>
    <button class="chip" data-cat="live">Trực tiếp</button>
  </div>

  <!-- Full-Screen Search Overlay -->
  <div id="search-overlay" class="search-overlay hidden">
    <div class="search-header">
      <button id="search-back-btn" class="icon-btn" aria-label="Quay lại">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
          <path d="M20 11.25H6.81l5.72-5.72a.75.75 0 0 0-1.06-1.06l-7 7a.75.75 0 0 0 0 1.06l7 7a.75.75 0 0 0 1.06-1.06l-5.72-5.72H20a.75.75 0 0 0 0-1.5Z"/>
        </svg>
      </button>
      <form id="search-form" class="search-input-wrap">
        <input
          id="search-input"
          type="search"
          placeholder="Tìm trên YouTube hoặc dán link..."
          autocomplete="off"
          autocapitalize="off"
          enterkeyhint="search"
        >
        <button type="button" id="search-clear-btn" class="search-clear hidden" aria-label="Xóa">✕</button>
      </form>
    </div>
    <div id="search-suggestions" class="search-suggestions"></div>
  </div>

  <!-- Main Scrollable Views -->
  <main id="main-content" class="main-content">
    <section id="view-home" class="view active">
      <div id="home-feed" class="video-feed"></div>
    </section>

    <section id="view-search" class="view hidden">
      <div id="search-query-bar" class="search-active-bar hidden">
        <button id="search-reopen-btn" class="search-reopen-pill">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M10.5 3a7.5 7.5 0 1 0 4.74 13.32l4.22 4.22a.75.75 0 1 0 1.06-1.06l-4.22-4.22A7.5 7.5 0 0 0 10.5 3Zm-6 7.5a6 6 0 1 1 12 0 6 6 0 0 1-12 0Z"/>
          </svg>
          <span id="search-current-text"></span>
        </button>
      </div>
      <div id="search-results" class="video-feed"></div>
    </section>

    <section id="view-shorts" class="view hidden">
      <div id="shorts-container" class="shorts-container"></div>
    </section>

    <section id="view-subs" class="view hidden">
      <div id="subs-content" class="subs-wrap"></div>
    </section>

    <section id="view-you" class="view hidden">
      <div id="you-content" class="you-wrap"></div>
    </section>

    <section id="view-channel" class="view hidden">
      <div id="channel-content" class="channel-wrap"></div>
    </section>
  </main>

  <!-- Watch Sheet & Docked Miniplayer -->
  <aside id="watch-sheet" class="watch-sheet hidden" aria-label="Trình phát video">
    <!-- 16:9 Video / Audio Stage -->
    <div id="player-stage" class="player-stage">
      <video
        id="slave-video"
        muted
        playsinline
        webkit-playsinline
        preload="auto"
      ></video>

      <!-- Audio-Only Mode Visual Stage -->
      <div id="audio-mode-poster" class="audio-mode-poster hidden">
        <img id="audio-poster-bg" class="audio-poster-bg" alt="">
        <div class="audio-poster-card">
          <img id="audio-poster-img" class="audio-poster-img" alt="">
          <div class="audio-eq-bars" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
          </div>
          <p class="audio-mode-caption">Chế độ chỉ âm thanh · Chạy nền siêu tiết kiệm pin</p>
        </div>
      </div>

      <!-- Buffering Spinner -->
      <div id="player-spinner" class="player-spinner hidden">
        <div class="spinner-ring"></div>
      </div>

      <!-- Double-tap Seek Ripples -->
      <div id="seek-ripple-left" class="seek-ripple left hidden">⏪ 10 giây</div>
      <div id="seek-ripple-right" class="seek-ripple right hidden">10 giây ⏩</div>

      <!-- Tap Overlay Controls -->
      <div id="player-controls" class="player-controls visible">
        <div class="player-top-row">
          <button id="minimize-btn" class="ctrl-icon-btn" aria-label="Thu nhỏ trình phát">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
              <path d="M6.47 8.47a.75.75 0 0 1 1.06 0L12 12.94l4.47-4.47a.75.75 0 1 1 1.06 1.06l-5 5a.75.75 0 0 1-1.06 0l-5-5a.75.75 0 0 1 0-1.06Z"/>
            </svg>
          </button>
          <div class="player-top-pills">
            <button id="audio-only-top-btn" class="player-pill" title="Bật/tắt chỉ nghe tiếng">🎧 Tiếng</button>
            <button id="quality-btn" class="player-pill">720p</button>
            <button id="speed-btn" class="player-pill">1x</button>
            <button id="pip-btn" class="ctrl-icon-btn" aria-label="Hình trong hình">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path d="M19 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Zm0 14H5V6h14v12Zm-8-6h7v5h-7v-5Z"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="player-center-row">
          <button id="prev-btn" class="ctrl-circle-btn sm" aria-label="Video trước">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path d="M6 6h2v12H6V6Zm3.5 6 8.5 6V6l-8.5 6Z"/>
            </svg>
          </button>
          <button id="play-pause-btn" class="ctrl-circle-btn lg" aria-label="Phát hoặc tạm dừng">
            <svg id="icon-play" viewBox="0 0 24 24" width="34" height="34" fill="currentColor" class="hidden">
              <path d="M8 5v14l11-7L8 5Z"/>
            </svg>
            <svg id="icon-pause" viewBox="0 0 24 24" width="34" height="34" fill="currentColor">
              <path d="M6 5h4v14H6V5Zm8 0h4v14h-4V5Z"/>
            </svg>
          </button>
          <button id="next-btn" class="ctrl-circle-btn sm" aria-label="Video tiếp theo">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path d="m6 18 8.5-6L6 6v12ZM16 6v12h2V6h-2Z"/>
            </svg>
          </button>
        </div>

        <div class="player-bottom-row">
          <span id="time-display" class="time-display">0:00 / 0:00</span>
          <button id="fullscreen-btn" class="ctrl-icon-btn" aria-label="Toàn màn hình">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
              <path d="M7 14H5v5h5v-2H7v-3Zm-2-4h2V7h3V5H5v5Zm12 7h-3v2h5v-5h-2v3ZM14 5v2h3v3h2V5h-5Z"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Scrubbable Timeline -->
      <div id="progress-wrap" class="progress-wrap">
        <div id="progress-buffer" class="progress-buffer"></div>
        <div id="sponsor-markers" class="sponsor-markers"></div>
        <div id="progress-fill" class="progress-fill"></div>
        <input id="seek-slider" type="range" min="0" max="1000" value="0" step="1" aria-label="Thanh tiến trình">
      </div>
    </div>

    <!-- Minimized Miniplayer Bar -->
    <div id="mini-bar" class="mini-bar hidden">
      <div id="mini-tap-area" class="mini-tap-area">
        <img id="mini-thumb" class="mini-thumb" alt="">
        <div class="mini-meta">
          <div id="mini-title" class="mini-title">Đang tải...</div>
          <div id="mini-channel" class="mini-channel">YouTube</div>
        </div>
      </div>
      <div class="mini-controls">
        <button id="mini-play-btn" class="icon-btn" aria-label="Phát/Tạm dừng">
          <svg id="mini-icon-play" viewBox="0 0 24 24" width="26" height="26" fill="currentColor" class="hidden">
            <path d="M8 5v14l11-7L8 5Z"/>
          </svg>
          <svg id="mini-icon-pause" viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
            <path d="M6 5h4v14H6V5Zm8 0h4v14h-4V5Z"/>
          </svg>
        </button>
        <button id="mini-next-btn" class="icon-btn" aria-label="Bài tiếp">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <path d="m6 18 8.5-6L6 6v12ZM16 6v12h2V6h-2Z"/>
          </svg>
        </button>
        <button id="mini-close-btn" class="icon-btn" aria-label="Đóng">✕</button>
      </div>
      <div class="mini-progress-track">
        <div id="mini-progress-fill" class="mini-progress-fill"></div>
      </div>
    </div>

    <!-- Expanded Watch Metadata & Up Next -->
    <div id="watch-body" class="watch-body">
      <div id="watch-title-box" class="watch-title-box">
        <h1 id="watch-title" class="watch-title">Đang tải video...</h1>
        <div id="watch-submeta" class="watch-submeta">
          <span id="watch-views"></span>
          <span id="watch-date"></span>
          <span class="more-link">...xem thêm</span>
        </div>
      </div>

      <div class="watch-channel-row">
        <div id="watch-channel-tap" class="watch-channel-left">
          <div id="watch-avatar" class="avatar-circle">Y</div>
          <div class="watch-channel-text">
            <div id="watch-channel-name" class="watch-channel-name">YouTube</div>
            <div id="watch-subs-count" class="watch-subs-count"></div>
          </div>
        </div>
        <button id="watch-sub-btn" class="sub-btn">Đăng ký</button>
      </div>

      <div class="watch-actions">
        <button id="like-btn" class="action-pill">👍 Thích</button>
        <button id="sponsor-btn" class="action-pill active">🛡️ Chặn QC: Bật</button>
        <button id="audio-mode-btn" class="action-pill">🎧 Chỉ tiếng</button>
        <button id="loop-btn" class="action-pill">🔁 Lặp: Tắt</button>
        <button id="sleep-btn" class="action-pill">🌙 Hẹn giờ</button>
        <button id="save-btn" class="action-pill">➕ Nghe sau</button>
      </div>

      <div id="sleep-banner" class="sleep-banner hidden"></div>

      <div id="queue-box" class="queue-box hidden">
        <div class="section-row">
          <h3 class="section-heading">Hàng chờ tiếp theo (<span id="queue-count">0</span>)</h3>
          <button id="clear-queue-btn" class="text-btn">Xóa hết</button>
        </div>
        <div id="queue-list" class="compact-list"></div>
      </div>

      <div class="upnext-header">
        <h3 class="section-heading">Tiếp theo</h3>
        <label class="autoplay-switch">
          <span>Tự động phát</span>
          <input type="checkbox" id="autoplay-toggle" checked>
          <span class="switch-slider"></span>
        </label>
      </div>

      <div id="related-list" class="video-feed related-feed"></div>
    </div>
  </aside>

  <!-- Reusable iOS Bottom Action Sheet -->
  <div id="sheet-backdrop" class="sheet-backdrop hidden"></div>
  <div id="bottom-sheet" class="bottom-sheet hidden">
    <div class="sheet-handle"></div>
    <div id="sheet-title" class="sheet-title"></div>
    <div id="sheet-content" class="sheet-content"></div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <!-- Bottom Tab Navigation -->
  <nav id="bottom-nav" class="bottom-nav">
    <button class="nav-tab active" data-tab="home">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
        <path d="M12 3.3 3 10.5V21h6v-6h6v6h6V10.5L12 3.3Z"/>
      </svg>
      <span>Trang chủ</span>
    </button>
    <button class="nav-tab" data-tab="shorts">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
        <path d="M17.77 10.32l-1.2-.5L18 9.06a3.74 3.74 0 0 0-3.5-6.62l-8 4.5a3.74 3.74 0 0 0 .23 6.64l1.2.5L6.5 14.84a3.74 3.74 0 0 0 3.5 6.62l8-4.5a3.74 3.74 0 0 0-.23-6.64ZM10 14.65v-5.3L15 12l-5 2.65Z"/>
      </svg>
      <span>Shorts</span>
    </button>
    <button class="nav-tab" data-tab="subs">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
        <path d="M10 18v-6l5 3-5 3Zm7-15H7v1h10V3Zm3 3H4v1h16V6Zm2 3H2v12h20V9ZM3 10h18v10H3V10Z"/>
      </svg>
      <span>Kênh đăng ký</span>
    </button>
    <button class="nav-tab" data-tab="you">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
        <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Zm0 4a3 3 0 1 1-3 3 3 3 0 0 1 3-3Zm0 14a7.96 7.96 0 0 1-6-2.7c.05-1.99 4-3.08 6-3.08s5.95 1.09 6 3.08A7.96 7.96 0 0 1 12 20Z"/>
      </svg>
      <span>Bạn</span>
    </button>
  </nav>

  <script src="/static/app.js"></script>
</body>
</html>
